name: Android Runtime Check (ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libvulkan-dev
          cmake --version

      - name: Locate Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK: $NDK_DIR"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Configure runtime (arm64-v8a)
        run: |
          mkdir -p build/runtime
          cmake -S ports/android/runtime -B build/runtime -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build/configure.log

      - name: Build oot3d_native_game (keep going to collect ALL errors)
        id: build
        run: |
          set +e
          ninja -C build/runtime -k 0 oot3d_native_game 2>&1 | tee build/build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> $GITHUB_OUTPUT
          grep -nE "error:|FAILED:|undefined reference|ld.lld: error" build/build.log > build/errors.txt || true
          echo "errores: $(wc -l < build/errors.txt)"
          exit 0

      - name: Verify the library and JNI exports
        if: steps.build.outputs.status == '0'
        run: |
          SO=$(find build/runtime -name "libTriAevum.so" | head -n 1)
          test -f "$SO"
          ls -lh "$SO"
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" --dyn-syms "$SO" | grep -E "Java_org_triaevum_android_(SecondaryDisplayPresenter|MotionSensorBridge)" | tee build/jni_exports.txt
          test "$(wc -l < build/jni_exports.txt)" -ge 6

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-check-logs
          path: |
            build/configure.log
            build/build.log
            build/errors.txt
            build/jni_exports.txt
          if-no-files-found: warn

      - name: Fail if the build failed
        if: steps.build.outputs.status != '0'
        run: |
          echo "El build fallo (status ${{ steps.build.outputs.status }}). Descarga el artefacto runtime-check-logs."
          exit 1
